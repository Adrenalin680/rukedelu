{% extends "base.html" %}

{% block title %}Вход по QR{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card" style="border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <div class="card-header" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); border-radius: 15px 15px 0 0; color: white; padding: 20px;">
                <h4 class="mb-0 text-center"><i class="bi bi-qr-code"></i> Вход по QR-коду</h4>
            </div>
            <div class="card-body" style="padding: 30px; text-align: center;">
                <p style="color: #666; font-size: 0.95rem;">Отсканируйте QR-код камерой телефона для входа</p>
                
                <div style="background: white; padding: 20px; border-radius: 15px; display: inline-block; margin: 10px 0;">
                    <img src="{{ url_for('qr_code') }}" alt="QR-код для входа" style="width: 250px; height: 250px; border-radius: 10px;">
                </div>
                
                <div style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                    <p style="color: #666; font-size: 0.85rem; margin: 0;">
                        <i class="bi bi-info-circle" style="color: #1a1a2e;"></i>
                        Откройте камеру на телефоне и наведите на QR-код
                    </p>
                </div>
                
                <hr style="border-color: #e0e0e0; margin: 20px 0;">
                
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <a href="{{ url_for('login') }}" class="btn" style="padding: 10px 30px; border-radius: 25px; background: white; color: #1a1a2e; border: 2px solid #1a1a2e; font-weight: bold;">
                        <i class="bi bi-box-arrow-in-right"></i> Обычный вход
                    </a>
                    <a href="{{ url_for('register') }}" class="btn" style="padding: 10px 30px; border-radius: 25px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; border: none; font-weight: bold;">
                        <i class="bi bi-person-plus"></i> Регистрация
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
