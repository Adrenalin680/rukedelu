{% extends "base.html" %}

{% block title %}QR Вход{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card" style="border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <div class="card-header" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); border-radius: 15px 15px 0 0; color: white; padding: 20px;">
                <h4 class="mb-0 text-center"><i class="bi bi-qr-code"></i> Подтверждение входа</h4>
            </div>
            <div class="card-body" style="padding: 30px; text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 20px;">📱</div>
                <h5 style="color: #1a1a2e;">Подтвердите вход на устройстве</h5>
                <p style="color: #666; margin: 10px 0 20px 0;">
                    Вы сканировали QR-код для входа в систему.
                </p>
                
                <div style="padding: 20px; background: #e8f5e9; border-radius: 10px; margin: 15px 0;">
                    <i class="bi bi-check-circle" style="color: #28a745; font-size: 2rem;"></i>
                    <p style="color: #1a1a2e; font-weight: bold; margin: 10px 0 0 0;">
                        Нажмите "Подтвердить вход" чтобы войти
                    </p>
                </div>
                
                <div class="d-grid gap-2" style="max-width: 300px; margin: 20px auto;">
                    <a href="{{ url_for('qr_confirm', session_id=session_id) }}" class="btn" style="padding: 12px; border-radius: 25px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; border: none; font-weight: bold; font-size: 1.1rem;">
                        <i class="bi bi-check-lg"></i> Подтвердить вход
                    </a>
                    <a href="{{ url_for('index') }}" class="btn" style="padding: 10px; border-radius: 25px; background: white; color: #1a1a2e; border: 2px solid #1a1a2e;">
                        Отмена
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
